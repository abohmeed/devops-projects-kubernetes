# End of "GitLab CI stage 2: Delivery to staging". Stage 3 (promote, deploy) comes in the next lecture.
#
#   merge request      -> build            (does every image still build?)
#   push to main       -> push -> deliver  (images tagged with the short commit SHA, deployed to staging)
#
# No stored cloud keys: deploy jobs get a short-lived GitLab ID token, AWS exchanges it for
# temporary credentials of the role in AWS_ROLE_ARN, and EKS maps that role to the Kubernetes
# group "cicd", which may only edit the staging and production namespaces.
#
# CI/CD variables this file expects (Settings > CI/CD > Variables):
#   DOCKERHUB_USER    visible                 your Docker Hub username
#   DOCKERHUB_TOKEN   protected, masked+hidden  Docker Hub personal access token (Read & Write)
#   AWS_ROLE_ARN      protected, masked        arn:aws:iam::<ACCOUNT_ID>:role/gitlab-weatherapp-deployer
#   JWT_SECRET        protected, masked+hidden  openssl rand -hex 32
#   DB_ROOT_PASSWORD  protected, masked+hidden  openssl rand -hex 16
#   DB_PASSWORD       protected, masked+hidden  openssl rand -hex 16
#   WEATHER_CONTACT   protected, visible        your email address or project link (not a secret)
# Protected variables only reach pipelines on protected branches and protected tags,
# so main is protected (the default) and tags are protected with the pattern "*".

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - build
  - push
  - deliver

# ---------------------------------------------------------------------------
# Templates (names starting with a dot are not jobs; jobs reuse them with extends)

.docker:
  image: docker:29.8.1-cli
  services:
    - docker:29.8.1-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"

.deploy:
  image:
    name: amazon/aws-cli:2.37.4
    entrypoint: [""]
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  variables:
    AWS_REGION: us-east-1
    CLUSTER_NAME: basic-cluster
    AWS_WEB_IDENTITY_TOKEN_FILE: /tmp/web-identity-token
    AWS_ROLE_SESSION_NAME: gitlab-$CI_JOB_ID
    HELM_VERSION: v4.3.0
    HELM_SHA256: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb
  before_script:
    - echo "$GITLAB_OIDC_TOKEN" > "$AWS_WEB_IDENTITY_TOKEN_FILE"
    - dnf install -y -q tar gzip
    - curl -fsSL -o /tmp/helm.tar.gz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
    - echo "${HELM_SHA256}  /tmp/helm.tar.gz" | sha256sum -c -
    - tar -xzf /tmp/helm.tar.gz -C /tmp
    - mv /tmp/linux-amd64/helm /usr/local/bin/helm
    - aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION" --alias "$CLUSTER_NAME"
  script:
    - >
      helm upgrade --install weatherapp-auth ./weatherapp-auth
      --namespace "$NAMESPACE"
      --set image.repository="$DOCKERHUB_USER/weatherapp-auth"
      --set image.tag="$IMAGE_TAG"
      --set jwtSecret="$JWT_SECRET"
      --set mysql.auth.rootPassword="$DB_ROOT_PASSWORD"
      --set mysql.auth.password="$DB_PASSWORD"
      --wait --rollback-on-failure --timeout 10m
    - >
      helm upgrade --install weatherapp-weather ./weatherapp-weather
      --namespace "$NAMESPACE"
      --set image.repository="$DOCKERHUB_USER/weatherapp-weather"
      --set image.tag="$IMAGE_TAG"
      --set contact="$WEATHER_CONTACT"
      --wait --rollback-on-failure --timeout 5m
    - >
      helm upgrade --install weatherapp-ui ./weatherapp-ui
      --namespace "$NAMESPACE"
      --set image.repository="$DOCKERHUB_USER/weatherapp-ui"
      --set image.tag="$IMAGE_TAG"
      --set jwtSecret="$JWT_SECRET"
      --wait --rollback-on-failure --timeout 5m

# ---------------------------------------------------------------------------
# Stage 1: build (merge requests) and push (main)

build:
  extends: .docker
  stage: build
  script:
    - docker build --tag weatherapp-auth auth
    - docker build --tag weatherapp-ui UI
    - docker build --tag weatherapp-weather weather
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

push:
  extends: .docker
  stage: push
  script:
    - echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USER" --password-stdin
    - docker build --tag "$DOCKERHUB_USER/weatherapp-auth:$CI_COMMIT_SHORT_SHA" auth
    - docker push "$DOCKERHUB_USER/weatherapp-auth:$CI_COMMIT_SHORT_SHA"
    - docker build --tag "$DOCKERHUB_USER/weatherapp-ui:$CI_COMMIT_SHORT_SHA" UI
    - docker push "$DOCKERHUB_USER/weatherapp-ui:$CI_COMMIT_SHORT_SHA"
    - docker build --tag "$DOCKERHUB_USER/weatherapp-weather:$CI_COMMIT_SHORT_SHA" weather
    - docker push "$DOCKERHUB_USER/weatherapp-weather:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------------------
# Stage 2: deliver to staging (main)

deliver:
  extends: .deploy
  stage: deliver
  environment:
    name: staging
  resource_group: staging
  variables:
    NAMESPACE: staging
    IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

