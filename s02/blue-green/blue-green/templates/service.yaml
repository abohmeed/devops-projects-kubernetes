{{- if not (has .Values.activeVersion (list "blue" "green")) }}
{{- fail "activeVersion must be blue or green" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "blue-green.fullname" . }}
  labels:
    {{- include "blue-green.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "blue-green.selectorLabels" . | nindent 4 }}
    version: {{ .Values.activeVersion }}
