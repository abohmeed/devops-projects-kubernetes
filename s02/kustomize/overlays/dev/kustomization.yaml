apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
  - ../../base
images:
  - name: traefik/whoami
    newTag: v1.12.0
patches:
  - target:
      kind: Deployment
      name: hello
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args
        value: ["--verbose"]
