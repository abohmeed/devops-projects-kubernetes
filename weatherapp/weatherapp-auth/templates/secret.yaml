apiVersion: v1
kind: Secret
metadata:
  name: {{ include "weatherapp-auth.fullname" . }}
  labels:
    {{- include "weatherapp-auth.labels" . | nindent 4 }}
type: Opaque
data:
  jwt-secret: {{ required "set jwtSecret (the same value in the auth and ui releases)" .Values.jwtSecret | b64enc | quote }}
